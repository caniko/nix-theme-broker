name: check

on:
  push:
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix fmt -- --check .
      - run: nix flake check --no-update-lock-file --all-systems
      - run: nix develop -c python3 providers/gruvbox/update.py
